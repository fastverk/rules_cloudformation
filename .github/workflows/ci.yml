name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # TEMPORARY PROBE — delete before merge. Discriminates between "this repo cannot run
  # any workflow" and "the cross-org reusable call is rejected". If this job produces a
  # job record and `ci` does not, the call is the problem.
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: echo "inline job materialized"
